
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ic7-rag-assistant-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ic7-rag-assistant-frontend
    ports:
      - "8501:8501"
    environment:
      # Dentro de la red de Docker, el frontend se comunica con el servicio 'backend'
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped